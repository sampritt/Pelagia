<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#062a46">
    <meta name="robots" content="noindex">
    <title>You're offline - Pelagia</title>
    <link rel="manifest" href="{{ url_for('pwa_manifest') }}">
    <link rel="icon" href="{{ url_for('static', filename='img/pelagia-mark.svg') }}" type="image/svg+xml">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css', v=pwa_asset_version) }}">
    <script defer src="{{ url_for('static', filename='js/pwa.js', v=pwa_asset_version) }}"></script>
</head>
<body class="offline-body">
    <main class="offline-card">
        <img class="offline-icon" src="{{ url_for('static', filename='img/icon-192.png') }}" width="80" height="80" alt="Pelagia">
        <p class="eyebrow">Pelagia</p>
        <h1>You're offline</h1>
        <p>Reconnect to view or save your dives, then try again.</p>
        <button class="primary-button" type="button" data-pwa-retry>Try again</button>
        <a class="ghost-button" href="/">Go to Pelagia</a>
        <p class="offline-hint">Dive logging needs an internet connection.</p>
    </main>
</body>
</html>
