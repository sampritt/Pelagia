        <section class="dive-logs" aria-labelledby="feedTitle">
            <h2 id="feedTitle" class="sr-only">Logged dives</h2>
            <div class="dive-logs-list">
                {% if dives %}
                    {% for dive in dives %}
                        {% include "_dive_card.html" %}
                    {% endfor %}
                {% else %}
                    <div class="empty-state">
                        <h2>No dives yet</h2>
                        <p>Log a dive or follow other divers to see their dives here.</p>
                        <a class="primary-button" href="{{ url_for('log_dive') }}">Log dive</a>
                    </div>
                {% endif %}
            </div>
        </section>
