{% extends "auth.html" %}
{% block title %}Choose your username — Pelagia{% endblock %}
{% block auth_content %}
<h1 id="signinTitle">Choose your username</h1>
<p class="signin-description">Your public name on your profile and dives. Your Google email stays private.</p>
<form class="auth-form" method="post" action="{{ url_for('google_auth.signup') }}">
    <input type="hidden" name="csrf_token" value="{{ google_csrf_token() }}">
    <label for="publicUsername">Username</label>
    <input id="publicUsername" name="username" autocomplete="nickname" minlength="3" maxlength="40" value="{{ username }}" aria-describedby="usernameHelp" required autofocus>
    <small id="usernameHelp">3–40 characters.</small>
    <button class="welcome-button" type="submit">Create account <span aria-hidden="true">↗</span></button>
</form>
{% endblock %}
