<div class="brief-reader" data-brief-reader data-brief-edition="{{ brief.effective_date.isoformat() }}">
    <header class="brief-toolbar">
        <span class="brief-toolbar-label">The daily dispatch</span>
        <a class="brief-pelagia" href="{{ url_for('home') }}" aria-label="Pelagia home" data-brief-close>
            <img src="{{ url_for('static', filename='img/pelagia-mark.png') }}" alt="" width="26" height="26">Pelagia
        </a>
        <div class="brief-progress" aria-hidden="true"><span data-brief-progress></span></div>
    </header>
    <div class="brief-scroll" data-brief-scroll tabindex="0" role="region" aria-label="The Dive Brief newsletter">
        <article class="brief-edition">
            <header class="brief-edition-head">
                <p class="brief-eyebrow"><span aria-hidden="true"></span>Your daily surface interval</p>
                <h1 id="briefTitle">{{ brief.title }}</h1>
                <div class="brief-edition-meta">
                    <time datetime="{{ brief.effective_date.isoformat() }}">{{ brief.date_label }}</time>
                    <span>{{ brief.read_minutes }} min read</span>
                </div>
                <p class="brief-edition-headline">{{ brief.headline }}</p>
            </header>
            <div class="brief-prose">{{ brief.body_html }}</div>
            <footer class="brief-endnote">
                <span class="brief-endmark" aria-hidden="true">≈</span>
                <p>You’re all caught up.<br><strong>See you below the surface.</strong></p>
                <a class="brief-read-more" href="{{ url_for('home') }}" data-brief-close>
                    <span class="brief-link-label">Back to feed</span>
                    <span class="brief-arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"></path></svg></span>
                </a>
            </footer>
        </article>
    </div>
</div>
