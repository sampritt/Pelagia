{% extends "base.html" %}
{% block title %}Add a cert - Pelagia{% endblock %}

{% block content %}
<section class="log-layout">
    <form class="dive-form keyboard-flow" method="post">
        <div class="section-head">
            <div>
                <h1>{{ 'Edit cert' if is_edit else 'Add a cert' }}</h1>
            </div>
            <div class="form-actions">
                <a class="ghost-button" href="{{ url_for('cert_detail') if is_edit else url_for('profile') }}">Cancel</a>
                <button class="primary-button compact" type="submit">{{ 'Save changes' if is_edit else 'Save cert' }}</button>
            </div>
        </div>

        <div class="form-section">
            <div class="form-section-title">
                <h2>Certification</h2>
            </div>
            <div class="form-grid">
                <label>
                    Agency
                    <select name="agency" required>
                        <option value="PADI" selected>PADI</option>
                    </select>
                </label>
                <label>
                    Level
                    <select name="level" required>
                        <option value="" disabled {{ 'selected' if not is_edit else '' }}>Select level</option>
                        {% for level in cert_levels %}
                            <option value="{{ level }}" {{ 'selected' if is_edit and cert.level == level else '' }}>{{ level }}</option>
                        {% endfor %}
                    </select>
                </label>
            </div>
        </div>

        <div class="form-footer">
            <button class="primary-button" type="submit">{{ 'Save changes' if is_edit else 'Save cert' }}</button>
        </div>
    </form>
</section>
{% endblock %}
