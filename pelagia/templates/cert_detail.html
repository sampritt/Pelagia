{% extends "base.html" %}
{% block title %}Dive cert - Pelagia{% endblock %}

{% block content %}
<section class="dive-detail cert-detail">
    <div class="dive-detail-head">
        <div class="dive-detail-author">
            <div class="cert-badge" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <path d="M3 5h18v14H3Z"></path>
                    <path d="M7 9h5"></path>
                    <path d="M7 13h4"></path>
                    <path d="M15 10h3"></path>
                    <path d="M15 14h3"></path>
                </svg>
            </div>
            <div>
                <strong>{{ cert.level }}</strong>
                <p>{{ cert.agency }} certification</p>
            </div>
        </div>
        <div class="form-actions">
            <form method="post" action="{{ url_for('delete_cert') }}">
                <button class="icon-button danger-button" type="submit" aria-label="Delete cert" title="Delete cert">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 6h18"></path>
                        <path d="M8 6V4h8v2"></path>
                        <path d="M19 6l-1 14H6L5 6"></path>
                        <path d="M10 11v5"></path>
                        <path d="M14 11v5"></path>
                    </svg>
                </button>
            </form>
            <a class="icon-button" href="{{ url_for('edit_cert') }}" aria-label="Edit cert" title="Edit cert">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 20h9"></path>
                    <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
                </svg>
            </a>
        </div>
    </div>

    <div class="detail-panel cert-card">
        <h2>Card</h2>
        <dl class="detail-metric-list">
            <div>
                <dt>Agency</dt>
                <dd>{{ cert.agency }}</dd>
            </div>
            <div>
                <dt>Level</dt>
                <dd>{{ cert.level }}</dd>
            </div>
            <div>
                <dt>Cert No.</dt>
                <dd>{{ cert.cert_no }}</dd>
            </div>
            <div>
                <dt>Cert Date</dt>
                <dd>{{ cert.cert_date }}</dd>
            </div>
        </dl>
    </div>
</section>
{% endblock %}
