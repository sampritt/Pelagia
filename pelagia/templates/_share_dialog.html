{% from "_action_icons.html" import action_icon %}
<dialog class="share-dialog" data-share-dialog aria-labelledby="shareDialogTitle">
    <div class="share-dialog-heading">
        <h2 id="shareDialogTitle">Share this dive</h2>
        <button class="icon-button dialog-close-button" type="button" data-share-close aria-label="Close sharing"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"></path></svg></button>
    </div>
    <div class="share-preview-carousel" data-share-carousel role="region" aria-roledescription="carousel" aria-label="Dive image styles" tabindex="0">
        <img class="share-preview-image" data-share-preview alt="Branded dive image with a map" draggable="false">
        <div class="share-preview-dots" role="group" aria-label="Image style">
            <button class="share-preview-dot" type="button" data-share-style="0" aria-label="Map image" aria-pressed="true"><span aria-hidden="true"></span></button>
            {% for layout in ('vertical', 'horizontal', 'stacked', 'map') %}
            <button class="share-preview-dot" type="button" data-share-style="{{ loop.index }}" aria-label="Transparent {{ layout }} image" aria-pressed="false"><span aria-hidden="true"></span></button>
            {% endfor %}
            <button class="share-preview-dot" type="button" data-share-style="5" aria-label="Transparent depth profile image" aria-pressed="false" hidden><span aria-hidden="true"></span></button>
        </div>
    </div>
    <span class="sr-only" data-share-counter role="status" aria-live="polite">Image 1 of 5</span>
    <div class="share-options" aria-label="Share options">
        <button class="share-option" type="button" data-share-copy>
            <span class="share-option-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="16" rx="2"></rect><rect x="9" y="3" width="6" height="4" rx="1"></rect><path d="M9 12h6M9 16h6"></path></svg></span>
            <span data-share-copy-label>Copy link</span>
        </button>
        <button class="share-option" type="button" data-share-save>
            <span class="share-option-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M4 16v5h16v-5"></path></svg></span>
            <span data-share-save-label>Save image</span>
        </button>
        <button class="share-option" type="button" data-share-native>
            <span class="share-option-icon">{{ action_icon("share") }}</span>
            <span>More</span>
        </button>
    </div>
    <input class="share-fallback-link" data-share-link readonly type="url" aria-label="Dive link to copy" hidden>
    <p class="share-status" data-share-status role="status" aria-live="polite"></p>
</dialog>
