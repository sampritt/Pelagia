{% set has_coords = item.latitude is not none and item.longitude is not none %}
<a class="site-report-card feed-site-report" href="{{ url_for('dive_site_profile', site_id=item.id) }}#daily-report"
   aria-labelledby="followedSiteTitle{{ item.id }}"
   {% if item.featured %}data-featured-site-report{% endif %}
   data-followed-site-report data-report-state="loading"
   data-report-url="{{ url_for('api_site_report', site_id=item.id) }}"
   data-description-url="{{ url_for('api_dive_site_description', site_id=item.id) }}"
   data-conditions-url="{{ url_for('api_site_conditions', site_id=item.id) }}">
    <div class="mini-map site-report-map {{ 'map-pending' if not has_coords else '' }}" aria-hidden="true" {% if has_coords %}data-static-map data-map-lat="{{ item.latitude }}" data-map-lng="{{ item.longitude }}" data-map-zoom="10"{% endif %}>
        {% if has_coords %}<span class="map-pin"></span>{% else %}{{ action_icon("compass") }}{% endif %}
    </div>
    <div class="site-report-identity">
        <div class="site-report-name"><h3 id="followedSiteTitle{{ item.id }}" title="{{ item.name }}">{{ item.name }}</h3>{% if item.featured %}<span class="site-report-featured">FEATURED</span>{% endif %}</div>
        <p title="{{ item.country_or_area or 'Location pending' }}">{{ item.country_or_area or 'Location pending' }}</p>
        <div class="followed-site-report" data-followed-report-body>
            <p class="followed-site-report-text" data-followed-report-text role="status" aria-live="polite" aria-atomic="true">Preparing today’s report…</p>
        </div>
    </div>
</a>
